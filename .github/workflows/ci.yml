name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Lockfile was generated with packageManager npm@11; Node 22 ships npm 10,
      # which rejects optional peer entries (cac@6.7.14, commander@15.0.0).
      - name: Use packageManager npm
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
